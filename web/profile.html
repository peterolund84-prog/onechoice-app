<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Profil — OneChoice</title>
  <link rel="stylesheet" href="/static/app.css?v=v10-20260726" />
</head>
<body>
  <header class="header"><div class="logo">OneCho<span class="logo-i">ı<span class="logo-spark" aria-hidden="true"></span></span>ce</div></header>
  <main class="app" id="app"><div class="loading">Laddar…</div></main>
  <nav class="nav">
    <a href="/" data-nav="home">Hem</a>
    <a href="/lista" data-nav="lista">Lista</a>
    <a href="/history" data-nav="history">Historik</a>
    <a href="/profile" data-nav="profile" class="active">Profil</a>
  </nav>
  <script src="/static/app.js?v=v10-20260726"></script>
  <script>
    (async function () {
      const { api, ensureGuest, navActive, esc } = window.OC;
      navActive("profile");
      await ensureGuest();
      const p = await api.get("/api/profile");
      const integ = p.integrations || {};
      document.getElementById("app").innerHTML = `
        <div class="pro">
          <h2>OneChoice Pro</h2>
          <p class="muted">Obegränsad historik och skarpare preferenser.</p>
          <p style="font-weight:700;margin:12px 0">49 kr/mån</p>
          <button class="btn btn-primary" type="button" disabled>Uppgradera</button>
        </div>
        <p class="muted">${p.guest_mode ? "Guest / lokal demo" : esc(p.email || "Inloggad")}</p>
        <div class="pro" style="margin-top:12px">
          <h2 style="font-size:1.15rem">Integrationer</h2>
          <p class="muted">Supabase: ${esc(integ.supabase || "—")}</p>
          <p class="muted">TMDB (film): ${esc(integ.tmdb || "—")}</p>
          <p class="muted">AI (Grok): ${esc(integ.grok || p.ai_status || "—")}</p>
          <p class="muted" style="font-size:12px;margin-top:8px">Secrets-fil: ${esc(integ.secrets_file || "ej hittad")}</p>
        </div>
        <p class="muted"><strong>Build:</strong> ${esc(p.build)}</p>
        <p class="muted">Stack: ${esc(p.stack)}</p>
        <p class="muted" style="font-size:12px">Build ska innehålla <code>html-local-posters-v11</code>. Film-poster ska synas utan nätverk till TMDB.</p>
        <p style="margin-top:20px"><a class="linkish" href="/auth">Logga in</a></p>
      `;
    })();
  </script>
</body>
</html>
