<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Profil — OneChoice</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="header"><div class="logo"><span class="logo-spark"></span>OneChoice</div></header>
  <main class="app" id="app"><div class="loading">Laddar…</div></main>
  <nav class="nav">
    <a href="/" data-nav="home">Hem</a>
    <a href="/lista" data-nav="lista">Lista</a>
    <a href="/history" data-nav="history">Historik</a>
    <a href="/profile" data-nav="profile" class="active">Profil</a>
  </nav>
  <script src="/static/app.js"></script>
  <script>
    (async function () {
      const { api, ensureGuest, navActive } = window.OC;
      navActive("profile");
      await ensureGuest();
      const p = await api.get("/api/profile");
      document.getElementById("app").innerHTML = `
        <div class="pro">
          <h2>OneChoice Pro</h2>
          <p class="muted">Obegränsad historik och skarpare preferenser.</p>
          <p style="font-weight:700;margin:12px 0">49 kr/mån</p>
          <button class="btn btn-primary" type="button" disabled>Uppgradera</button>
        </div>
        <p class="muted">${p.guest_mode ? "Guest / lokal demo" : p.email || "Inloggad"}</p>
        <p class="muted">AI: ${p.ai_status}</p>
        <p class="muted">Build: ${p.build} · ${p.stack}</p>
        <p style="margin-top:20px"><a class="linkish" href="/auth">Logga in</a></p>
      `;
    })();
  </script>
</body>
</html>
