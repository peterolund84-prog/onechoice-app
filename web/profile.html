<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OneChoice" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <title>Profil — OneChoice</title>
  <link rel="stylesheet" href="/static/app.css?v=v14-20260726" />
</head>
<body>
  <header class="header"><div class="logo">OneCho<span class="logo-i">ı<span class="logo-spark" aria-hidden="true"></span></span>ce</div></header>
  <main class="app" id="app"><div class="loading">Laddar…</div></main>
  <nav class="nav" id="app-nav" data-active="profile" aria-label="Huvudmeny"></nav>
  <script src="/static/app.js?v=v14-20260726"></script>
  <script>
    (async function () {
      const { api, ensureGuest, esc } = window.OC;
      await ensureGuest();
      const p = await api.get("/api/profile");
      const integ = p.integrations || {};

      let aiLine = "AI: ej testad ännu";
      try {
        const llm = await api.get("/api/health/llm");
        if (llm && llm.ok && llm.model) {
          aiLine = `AI: ${llm.model} ✓`;
        } else if (llm && !llm.ok) {
          const detail = (llm.detail || "").trim();
          if (/nyckel|no_api_key|saknas/i.test(detail)) {
            aiLine = "AI: offline — API-nyckel saknas";
          } else {
            aiLine = `AI: offline — ${detail.slice(0, 120) || "ingen modell svarade"}`;
          }
        }
      } catch (e) {
        aiLine = `AI: offline — ${esc((e && e.message) || "kunde inte nå probe")}`;
      }

      document.getElementById("app").innerHTML = `
        <div class="pro">
          <h2>OneChoice Pro</h2>
          <p class="muted">Obegränsad historik och skarpare preferenser.</p>
          <p style="font-weight:700;margin:12px 0">49 kr/mån</p>
          <button class="btn btn-primary" type="button" disabled>Uppgradera</button>
        </div>
        <p class="muted">${p.guest_mode ? "Guest / lokal demo" : esc(p.email || "Inloggad")}</p>
        <p class="muted" id="ai-status">${esc(aiLine)}</p>
        <div class="pro" style="margin-top:12px">
          <h2 style="font-size:1.15rem">Integrationer</h2>
          <p class="muted">Supabase: ${esc(integ.supabase || "—")}</p>
          <p class="muted">TMDB (film): ${esc(integ.tmdb || "—")}</p>
          <p class="muted">Secrets-fil: ${esc(integ.secrets_file || "ej hittad")}</p>
        </div>
        <p class="muted"><strong>Build:</strong> ${esc(p.build)}</p>
        <p class="muted">Stack: ${esc(p.stack)}</p>
        <p class="muted" style="font-size:12px">Build ska innehålla <code>html-quality-pwa-v14</code>.</p>
        <p style="margin-top:20px"><a class="linkish" href="/auth">Logga in</a></p>
      `;
    })();
  </script>
</body>
</html>
