<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lista — OneChoice</title>
  <link rel="stylesheet" href="/static/app.css?v=v7-20260726" />
</head>
<body>
  <header class="header"><div class="logo">OneCho<span class="logo-i">ı<span class="logo-spark" aria-hidden="true"></span></span>ce</div></header>
  <main class="app" id="app"><div class="loading">Laddar lista…</div></main>
  <nav class="nav">
    <a href="/" data-nav="home">Hem</a>
    <a href="/lista" data-nav="lista" class="active">Lista</a>
    <a href="/history" data-nav="history">Historik</a>
    <a href="/profile" data-nav="profile">Profil</a>
  </nav>
  <script src="/static/app.js?v=v7-20260726"></script>
  <script>
    (async function () {
      const { api, ensureGuest, navActive } = window.OC;
      navActive("lista");
      await ensureGuest();
      async function render() {
        const data = await api.get("/api/lista");
        const items = data.items || [];
        const root = document.getElementById("app");
        root.innerHTML = `
          <h1 class="hero-title" style="font-size:1.8rem;text-align:left;margin-bottom:16px">Inköpslista</h1>
          ${
            !items.length
              ? `<p class="muted">Listan är tom. Bestäm middag, bocka i vad du behöver och lägg till.</p>`
              : `<ul class="list">${items
                  .map(
                    (it) =>
                      `<li class="${it.checked ? "done" : ""}">
                        <input type="checkbox" data-id="${it.id}" ${it.checked ? "checked" : ""} />
                        <span>${it.name}</span>
                      </li>`
                  )
                  .join("")}</ul>`
          }
          <div style="margin-top:16px">
            <input id="addName" placeholder="Lägg till..." style="width:100%;padding:14px 16px;border:1px solid var(--oc-border);border-radius:16px;font-size:1rem;margin-bottom:10px;font-family:inherit" />
            <button class="btn btn-primary" type="button" id="addBtn">Lägg till</button>
          </div>
        `;
        root.querySelectorAll("input[type=checkbox][data-id]").forEach((el) => {
          el.onchange = async () => {
            await api.patch(`/api/lista/items/${el.dataset.id}`, { checked: el.checked });
            render();
          };
        });
        document.getElementById("addBtn").onclick = async () => {
          const name = document.getElementById("addName").value.trim();
          if (!name) return;
          await api.post("/api/lista/items", { name });
          render();
        };
      }
      await render();
    })();
  </script>
</body>
</html>
