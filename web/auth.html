<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OneChoice" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <title>Logga in — OneChoice</title>
  <link rel="stylesheet" href="/static/app.css?v=v36-20260726" />
</head>
<body>
  <header class="header"><div class="logo">OneCho<span class="logo-i">ı<span class="logo-spark" aria-hidden="true"></span></span>ce</div></header>
  <main class="app">
    <h1 class="hero-title" style="font-size:1.8rem;text-align:left;margin-bottom:16px">Logga in</h1>
    <p class="error" id="setup" hidden></p>
    <form class="auth-form" id="form">
      <input type="email" id="email" placeholder="E-post" required />
      <input type="password" id="password" placeholder="Lösenord" required />
      <button class="btn btn-primary" type="submit" id="submit">Logga in</button>
    </form>
    <p class="error" id="err" hidden></p>
    <p class="muted">Saknar du konto? Guest-läge funkar utan login.</p>
    <a class="linkish" href="/">Tillbaka</a>
  </main>
  <script src="/static/app.js?v=v36-20260726"></script>
  <script>
    (async function () {
      const setup = document.getElementById("setup");
      const submit = document.getElementById("submit");
      try {
        const s = await window.OC.api.get("/api/auth/session");
        const sec = s.secrets || {};
        if (!s.supabase_configured) {
          setup.hidden = false;
          if (!sec.secrets_file_found) {
            setup.textContent =
              "Supabase-nycklar saknas lokalt. Skapa .streamlit/secrets.toml med SUPABASE_URL och SUPABASE_KEY (Streamlit Cloud-nycklar syns inte i uvicorn).";
          } else {
            setup.textContent =
              "Hittade secrets.toml men SUPABASE_URL/KEY saknas eller är placeholder. Film-posters behöver också TMDB_API_KEY i samma fil.";
          }
        }
      } catch (_) {}

      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const err = document.getElementById("err");
        submit.disabled = true;
        try {
          const res = await window.OC.api.post("/api/auth/login", {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          });
          if (!res.ok) throw new Error(res.error || "Login misslyckades");
          location.href = "/profile";
        } catch (ex) {
          err.hidden = false;
          err.textContent = ex.message;
        } finally {
          submit.disabled = false;
        }
      };
    })();
  </script>
</body>
</html>
