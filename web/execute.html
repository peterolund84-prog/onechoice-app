<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OneChoice" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <title>Laga — OneChoice</title>
  <link rel="stylesheet" href="/static/app.css?v=v13-20260726" />
</head>
<body>
  <header class="header"><div class="logo">OneCho<span class="logo-i">ı<span class="logo-spark" aria-hidden="true"></span></span>ce</div></header>
  <main class="app" id="app"><div class="loading">Laddar…</div></main>
  <nav class="nav">
    <a href="/" data-nav="home">Hem</a>
    <a href="/lista" data-nav="lista">Lista</a>
    <a href="/history" data-nav="history">Historik</a>
    <a href="/profile" data-nav="profile">Profil</a>
  </nav>
  <script src="/static/app.js?v=v13-20260726"></script>
  <script>
    (async function () {
      const {
        api, go, ensureGuest, esc, cardActionsHtml, bindCardActions, imgOrPh,
      } = window.OC;
      await ensureGuest();
      const root = document.getElementById("app");
      let data;
      try {
        data = await api.get("/api/decision/execute");
      } catch (_) {
        go("/");
        return;
      }
      const recipe = data.recipe || {};
      const shopping = data.shopping || {};
      const toBuy = shopping.to_buy || {};
      const pres = data.presentation || {};
      const nut = data.nutrition || pres.nutrition || null;
      const items = [];
      Object.entries(toBuy).forEach(([sec, arr]) => {
        (arr || []).forEach((name) => items.push({ name, sec }));
      });
      const steps = recipe.steps || [];
      const img = pres.dish_image_url;
      const meta = pres.food_meta || "";
      const actions = cardActionsHtml({
        isFavorite: !!pres.is_favorite,
        shareText: pres.share_text || "",
      });

      const nutHtml = nut
        ? `<div class="nut-stats" role="group" aria-label="Näringsvärden per portion">
            <div class="nut-stat"><span class="nut-val">${esc(nut.kcal)}</span><span class="nut-lab">KCAL</span></div>
            <div class="nut-stat"><span class="nut-val">${esc(nut.protein_g)} g</span><span class="nut-lab">PROTEIN</span></div>
            <div class="nut-stat"><span class="nut-val">${esc(nut.fat_g)} g</span><span class="nut-lab">FETT</span></div>
            <div class="nut-stat"><span class="nut-val">${esc(nut.carbs_g)} g</span><span class="nut-lab">KOLH</span></div>
          </div>`
        : "";

      root.innerHTML = `
        <article class="panel decision-card food-card">
          ${actions}
          ${imgOrPh(img, "food-img")}
          <div class="food-body">
            <div class="label">Att laga</div>
            <h1>${esc(data.suggestion || "—")}</h1>
            <p>${esc(data.justification || "")}</p>
            ${meta ? `<p class="food-meta">${esc(meta)}</p>` : ""}
            ${nutHtml}
          </div>
        </article>
        ${
          items.length
            ? `<div class="section-label">Handla</div>
               <ul class="list" id="shop">
                 ${items
                   .map(
                     (it, i) =>
                       `<li><input type="checkbox" data-i="${i}" checked /> <span>${esc(it.name)}</span></li>`
                   )
                   .join("")}
               </ul>
               <button class="btn btn-primary" type="button" id="merge">Lägg till i handlingslista</button>`
            : ""
        }
        ${
          steps.length
            ? `<div class="section-label">Recept</div>
               <ol class="list" style="list-style:decimal;padding-left:1.2rem">
                 ${steps.map((s) => `<li style="display:list-item;border:0">${esc(s)}</li>`).join("")}
               </ol>`
            : ""
        }
        <button class="btn btn-ghost" type="button" id="home">Hem</button>
        <p class="error" id="err" hidden></p>
      `;
      bindCardActions();

      const merge = document.getElementById("merge");
      if (merge) {
        merge.onclick = async () => {
          const names = [...document.querySelectorAll("#shop input:checked")].map(
            (el) => items[Number(el.dataset.i)].name
          );
          try {
            const res = await api.post("/api/decision/execute/merge-list", {
              item_names: names,
            });
            merge.textContent = `Tillagt ✓ (${res.added}) · Öppna listan`;
            merge.onclick = () => go("/lista");
          } catch (e) {
            document.getElementById("err").hidden = false;
            document.getElementById("err").textContent = e.message;
          }
        };
      }
      document.getElementById("home").onclick = () => go("/");
    })();
  </script>
</body>
</html>
