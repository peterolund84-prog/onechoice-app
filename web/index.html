<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="OneChoice" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <title>OneChoice</title>
  <link rel="stylesheet" href="/static/app.css?v=v21-20260726" />
</head>
<body>
  <header class="header"><div class="logo">OneCho<span class="logo-i">ı<span class="logo-spark" aria-hidden="true"></span></span>ce</div></header>
  <main class="app" id="app">
    <div class="loading">Laddar…</div>
  </main>
  <nav class="nav" id="app-nav" data-active="home" aria-label="Huvudmeny"></nav>
  <script src="/static/app.js?v=v21-20260726"></script>
  <script>
    (async function () {
      const { api, routeDecide, ICONS, TIP_ICO, ensureGuest, showToast } = window.OC;
      await ensureGuest();
      await api.post("/api/home/chooser", {});
      const home = await api.get("/api/home");
      const root = document.getElementById("app");
      const tip = home.tip || {};

      const cards = (home.domains || [])
        .map(
          (d) => `
        <button class="card" type="button" data-domain="${d.id}">
          <span class="card-ico">${ICONS[d.icon] || ""}</span>
          <span class="card-title">${d.label}</span>
          <span class="card-sub">${d.sub}</span>
        </button>`
        )
        .join("");

      root.innerHTML = `
        <section class="hero">
          <div class="hero-orb" aria-hidden="true"></div>
          <h1 class="hero-title">${home.hero.headline}</h1>
          <p class="hero-sub">Välj vad du vill ha hjälp med.</p>
        </section>
        <div class="section-label">Vad vill du bestämma?</div>
        <div class="grid">${cards}</div>
        <button class="tip" type="button" id="tipBtn" aria-expanded="false">
          <span class="tip-ico">${TIP_ICO}</span>
          <span class="tip-text">${tip.text || "Saknar du en kategori? Tipsa oss."}</span>
        </button>
        <div class="free suggest-box" id="suggestBox" hidden>
          <label class="suggest-label" for="suggestInput">Förslagslåda</label>
          <p class="suggest-help">Här samlar vi idéer till nya kategorier — det startar inget beslut.</p>
          <textarea id="suggestInput" rows="3" maxlength="500"
            placeholder="${tip.placeholder || "T.ex. podcast, inredning, spelkväll…"}"></textarea>
          <button class="btn btn-primary" type="button" id="suggestSubmit">${
            tip.submit_label || "Skicka förslag"
          }</button>
        </div>
        <p class="error" id="err" hidden></p>
        <p class="muted" id="suggestOk" hidden></p>
      `;

      const err = document.getElementById("err");
      const ok = document.getElementById("suggestOk");
      const setBusy = (busy) => {
        document.querySelectorAll("button").forEach((b) => (b.disabled = busy));
      };
      const showErr = (m) => {
        err.hidden = !m;
        err.textContent = m || "";
        if (m) ok.hidden = true;
      };
      const showOk = (m) => {
        ok.hidden = !m;
        ok.textContent = m || "";
        if (m) err.hidden = true;
      };

      root.querySelectorAll("[data-domain]").forEach((btn) => {
        btn.onclick = async () => {
          showErr("");
          setBusy(true);
          try {
            await routeDecide({ domain_hint: btn.dataset.domain });
          } catch (e) {
            showErr(e.message || "Kunde inte bestämma.");
            setBusy(false);
          }
        };
      });

      const tipBtn = document.getElementById("tipBtn");
      const box = document.getElementById("suggestBox");
      tipBtn.onclick = () => {
        const open = box.hidden;
        box.hidden = !open;
        tipBtn.setAttribute("aria-expanded", open ? "true" : "false");
        tipBtn.classList.toggle("open", open);
        if (open) document.getElementById("suggestInput").focus();
      };

      document.getElementById("suggestSubmit").onclick = async () => {
        const text = document.getElementById("suggestInput").value.trim();
        if (text.length < 2) return showErr("Skriv ett kort förslag först.");
        showErr("");
        showOk("");
        setBusy(true);
        try {
          const res = await api.post("/api/home/suggestion", { text });
          document.getElementById("suggestInput").value = "";
          showOk(res.message || "Tack för förslaget!");
          if (typeof showToast === "function") showToast("Förslag skickat");
        } catch (e) {
          showErr(e.message || "Kunde inte skicka förslaget.");
        } finally {
          setBusy(false);
        }
      };
    })();
  </script>
</body>
</html>
