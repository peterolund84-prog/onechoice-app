<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OneChoice" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <title>OneChoice</title>
  <link rel="stylesheet" href="/static/app.css?v=v39-20260726" />
</head>
<body class="page-home">
  <div class="home-bg" aria-hidden="true"></div>
  <div class="home-scrim" aria-hidden="true"></div>
  <main class="app home-app" id="app">
    <div class="loading home-loading">Laddar…</div>
  </main>
  <nav class="nav" id="app-nav" data-active="home" aria-label="Huvudmeny"></nav>
  <script src="/static/app.js?v=v39-20260726"></script>
  <script>
    (async function () {
      const { api, routeDecide, ICONS, ensureGuest, showToast, esc, mountNav } = window.OC;
      mountNav("home");
      await ensureGuest();
      await api.post("/api/home/chooser", {});
      const home = await api.get("/api/home");
      const root = document.getElementById("app");
      const tip = home.tip || {};

      const cards = (home.domains || [])
        .map(
          (d) => `
        <button class="home-tile" type="button" data-domain="${esc(d.id)}">
          <span class="home-tile-ico" aria-hidden="true">${ICONS[d.icon] || ""}</span>
          <span class="home-tile-title">${esc(d.label)}</span>
          <span class="home-tile-sub">${esc(d.sub)}</span>
        </button>`
        )
        .join("");

      root.innerHTML = `
        <header class="home-brand">
          <p class="home-logo">OneChoice</p>
          <h1 class="home-headline">Vad ska vi bestämma idag?</h1>
          <p class="home-sub">Välj vad du vill ha hjälp med.</p>
        </header>
        <div class="home-main">
          <p class="home-section-label">Vad vill du bestämma?</p>
          <div class="home-grid">${cards}</div>
          <button class="home-tip" type="button" id="tipBtn" aria-expanded="false">
            <span class="home-tip-text">${esc(tip.text || "Saknar du en kategori? Tipsa oss")}</span>
            <span class="home-tip-chev" aria-hidden="true"></span>
          </button>
          <div class="home-suggest" id="suggestBox" hidden>
            <p class="home-suggest-help">${esc(
              tip.help || "Här samlar vi idéer till nya kategorier — det startar inget beslut."
            )}</p>
            <textarea id="suggestInput" rows="3" maxlength="500"
              placeholder="${esc(tip.placeholder || "T.ex. podcast, inredning, spelkväll…")}"></textarea>
            <button class="home-suggest-submit" type="button" id="suggestSubmit">${esc(
              tip.submit_label || "Skicka förslag"
            )}</button>
          </div>
          <p class="home-msg home-msg-err" id="err" hidden></p>
          <p class="home-msg home-msg-ok" id="suggestOk" hidden></p>
        </div>
      `;

      const err = document.getElementById("err");
      const ok = document.getElementById("suggestOk");
      const setBusy = (busy) => {
        root.querySelectorAll("button").forEach((b) => (b.disabled = busy));
      };
      const showErr = (m) => {
        err.hidden = !m;
        err.textContent = m || "";
        if (m) ok.hidden = true;
      };
      const showOk = (m) => {
        ok.hidden = !m;
        ok.textContent = m || "";
        if (m) err.hidden = true;
      };

      root.querySelectorAll("[data-domain]").forEach((btn) => {
        btn.onclick = async () => {
          showErr("");
          setBusy(true);
          try {
            await routeDecide({ domain_hint: btn.dataset.domain });
          } catch (e) {
            showErr(e.message || "Kunde inte bestämma.");
            setBusy(false);
          }
        };
      });

      const tipBtn = document.getElementById("tipBtn");
      const box = document.getElementById("suggestBox");
      tipBtn.onclick = () => {
        const open = box.hidden;
        box.hidden = !open;
        tipBtn.setAttribute("aria-expanded", open ? "true" : "false");
        tipBtn.classList.toggle("is-open", open);
        if (open) document.getElementById("suggestInput").focus();
      };

      document.getElementById("suggestSubmit").onclick = async () => {
        const text = document.getElementById("suggestInput").value.trim();
        if (text.length < 2) return showErr("Skriv ett kort förslag först.");
        showErr("");
        showOk("");
        setBusy(true);
        try {
          const res = await api.post("/api/home/suggestion", { text });
          document.getElementById("suggestInput").value = "";
          showOk(res.message || "Tack för förslaget!");
          if (typeof showToast === "function") showToast("Förslag skickat");
        } catch (e) {
          showErr(e.message || "Kunde inte skicka förslaget.");
        } finally {
          setBusy(false);
        }
      };
    })();
  </script>
</body>
</html>
